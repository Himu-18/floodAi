services:
  - type: web
    name: floodai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --workers 1 ইচ্ছাকৃত: rate-limit/cache dict process-local, আর background scheduler
    # thread app import-এ চালু হয় (একাধিক worker = প্রতিটায় আলাদা limit + scheduler
    # ডুপ্লিকেট)। scale করতে হলে আগে rate limit Redis-এ আর scheduler আলাদা service-এ নাও।
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: WEATHER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: VALIDATION_COLLECT_SECRET
        generateValue: true
      # ── Persistent database (Render Disk লাগে — paid instance) ──
      # Render-এর filesystem ephemeral: disk ছাড়া floodai.db প্রতিটা deploy/restart-এ
      # মুছে যায় (users, community_reports, validation_log)। Disk যোগ করলে নিচের
      # দুটো অংশ uncomment করো (disk ছাড়া FLOODAI_DB_PATH সেট করলে app চালু হবে না)।
      # - key: FLOODAI_DB_PATH
      #   value: /var/data/floodai.db
    # disk:
    #   name: floodai-data
    #   mountPath: /var/data
    #   sizeGB: 1
